<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点式分析工具 · 可复算的分析地图</title>
<style>:root{--bg:#ffffff;--surface:#f7f7f5;--line:#e3e1db;--text:#2c2c2a;--muted:#6b6a65;--faint:#98968f;--purple:#534ab7;--purple-l:#eeedfe;--purple-m:#afa9ec;--green:#0f6e56;--green-l:#e1f5ee;--red:#a32d2d;--red-l:#fcebeb;--amber:#854f0b;--amber-l:#faeeda}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;margin-right:8px;white-space:nowrap}
.brand-dot{width:10px;height:10px;border-radius:3px;background:var(--purple);transform:rotate(45deg)}
.brand-sub{font-weight:400;font-size:11px;color:var(--faint);border-left:1px solid var(--line);padding-left:8px}
.tb{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;white-space:nowrap;font-size:12px}
.tb:hover{border-color:var(--purple-m);color:var(--purple)}
.tb.primary{border-color:var(--purple-m);color:var(--purple);background:var(--purple-l)}
.tb.danger:hover{border-color:var(--red);color:var(--red)}
.tb-state{font-size:11px;color:var(--faint);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.tb-search{border:1px solid var(--line);border-radius:7px;padding:5px 9px;width:130px;outline:none}
.tb-search:focus{border-color:var(--purple-m)}
#main{flex:1;display:flex;min-height:0}
#left{width:28%;min-width:300px;max-width:420px;flex:0 0 28%;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#chat{height:42%;flex:0 0 42%;display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:0}
#detail{flex:1;display:flex;flex-direction:column;min-height:0}
.pane-head{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:500;font-size:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.pane-hint{font-weight:400;font-size:11px;color:var(--faint);cursor:pointer}
#chatLog{flex:1;overflow:auto;padding:10px 12px}
.msg{margin-bottom:10px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--purple-l);border-color:var(--purple-m)}
.msg .msg-tip{display:block;margin-top:6px;font-size:11px;color:var(--faint)}
.msg .drag-tag{display:inline-block;margin-top:6px;padding:2px 7px;border:1px dashed var(--purple-m);border-radius:5px;color:var(--purple);font-size:11px;cursor:grab}
#chatInput{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
#q{flex:1;resize:none;border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none;line-height:1.5}
#q:focus{border-color:var(--purple-m)}
#ask{width:34px;border:0;border-radius:7px;background:var(--purple);color:#fff;font-size:14px}
#detailBody{flex:1;overflow:auto;padding:12px}
.empty{color:var(--faint);font-size:12px;text-align:center;padding:28px 8px;line-height:1.8}
#canvasWrap{flex:1;position:relative;overflow:hidden;background-color:#fbfbf9;background-image:radial-gradient(#d9d7d0 1px,transparent 1px);background-size:24px 24px}
#canvas{position:absolute;left:0;top:0;width:6000px;height:4000px;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:6000px;height:4000px;overflow:visible;pointer-events:none}
#edges path{pointer-events:stroke;cursor:pointer}
#nodes,#groups{position:absolute;left:0;top:0;width:6000px;height:4000px;pointer-events:none}
#nodes>*,#groups>*{pointer-events:auto}
.node{position:absolute;width:240px;height:176px;border-radius:10px;background:var(--bg);border:1px solid var(--purple-m);padding:10px 12px;display:flex;flex-direction:column;cursor:grab;user-select:none}
.node:active{cursor:grabbing}
.node.selected{border:2px dashed var(--purple);box-shadow:0 0 0 3px rgba(83,74,183,.10)}
.node.focus{outline:3px solid rgba(83,74,183,.25)}
.node.data{background:var(--purple-l);border-color:var(--purple)}
.node.cross{background:var(--green-l);border-color:var(--green)}
.node.stale{border-color:var(--amber)}
.n-top{display:flex;align-items:center;justify-content:space-between;height:18px;flex:0 0 18px}
.n-kind{font-size:11px;color:var(--purple);background:#fff;border:1px solid var(--purple-m);border-radius:4px;padding:0 5px;line-height:16px}
.node.cross .n-kind{color:var(--green);border-color:#9fe1cb}
.n-tools{display:flex;gap:4px}
.n-tools span{width:18px;height:18px;line-height:16px;text-align:center;border:1px solid var(--line);border-radius:4px;font-size:11px;color:var(--muted);background:#fff;cursor:pointer}
.n-tools span:hover{border-color:var(--purple);color:var(--purple)}
.n-tools span.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.n-title{font-weight:500;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-sum{color:var(--muted);font-size:11px;line-height:1.5;margin-top:3px;height:32px;overflow:hidden}
.n-tags{display:flex;gap:5px;align-items:center;margin-top:auto;font-size:11px;color:var(--faint)}
.n-tags i{font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.n-ask{display:flex;gap:5px;align-items:center;margin-top:5px}
.n-ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:11px;outline:none;background:#fff}
.n-ask b{width:22px;height:22px;line-height:20px;text-align:center;border-radius:5px;background:var(--purple);color:#fff;font-size:11px;font-weight:400;cursor:pointer}
.group-box{position:absolute;border:1.5px dashed var(--purple);border-radius:14px;background:rgba(238,237,254,.32)}
.group-label{position:absolute;top:-11px;left:12px;background:#fff;border:1px solid var(--purple-m);border-radius:5px;padding:0 7px;font-size:11px;color:var(--purple);line-height:19px}
#floatAsk{position:absolute;width:300px;background:#fff;border:2px solid var(--purple);border-radius:10px;padding:9px;z-index:30}
#floatAsk .fa-head{font-size:11px;color:var(--purple);margin-bottom:6px}
#floatAsk input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none;margin-bottom:6px}
#floatAsk .fa-row{display:flex;gap:6px}
#floatAsk button{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px;background:#fff;font-size:11px}
#floatAsk button.go{background:var(--purple);color:#fff;border-color:var(--purple)}
#canvasHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#b6b4ac;font-size:13px;pointer-events:none}
#zoomBar{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
#zoomBar button{border:0;background:transparent;width:26px;height:24px;font-size:14px;border-radius:5px}
#zoomBar button:hover{background:var(--surface)}
#zoomVal{font-size:11px;color:var(--muted);width:42px;text-align:center}
#suggestBar{position:absolute;left:14px;bottom:14px;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11px}
#suggestBar b{color:var(--purple);font-weight:500}
#suggestBar .sg-item{display:inline-block;margin:3px 4px 0 0;padding:2px 7px;border:1px solid var(--line);border-radius:5px;cursor:pointer}
#suggestBar .sg-item:hover{border-color:var(--purple);color:var(--purple)}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#2c2c2a;color:#fff;border-radius:7px;padding:7px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;background:rgba(44,44,42,.22);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-card{width:380px;background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px}
.modal-card h3{margin:0 0 12px;font-size:14px;font-weight:500}
.modal-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.modal-row button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;font-size:12px}
.modal-row button.on{background:var(--purple-l);border-color:var(--purple);color:var(--purple)}
.modal-card input,.modal-card textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;outline:none}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal-foot button{border:1px solid var(--line);border-radius:6px;padding:6px 14px;background:#fff;font-size:12px}
.modal-foot button.ok{background:var(--green);color:#fff;border-color:var(--green)}
.modal-foot button.del{color:var(--red);border-color:#f0b5b5}
.d-card{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:var(--surface)}
.d-chart{width:100%;height:auto;display:block}
.d-title{font-weight:500;font-size:13px;margin:2px 0 10px}
.d-table{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}
.d-table th,.d-table td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left}
.d-table th{color:var(--muted);font-weight:500}
.d-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{display:inline-block;min-width:20px;text-align:center;border-radius:9px;background:var(--purple-l);color:var(--purple);font-size:10px;padding:0 4px}
.d-concl{background:var(--green-l);border-left:3px solid var(--green);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12px;margin:8px 0}
.d-k{font-weight:500;font-size:12px;margin:12px 0 5px}
.d-k ul{margin:0;padding-left:18px;color:var(--muted);font-size:11px}
.d-spec{font:11px/1.6 ui-monospace,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
.d-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.d-actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;font-size:11px}
.d-actions button:hover{border-color:var(--purple);color:var(--purple)}
.stale-tip{background:var(--amber-l);color:var(--amber);border-radius:6px;padding:6px 9px;font-size:11px;margin-bottom:8px}
.msg-ctx{font-size:11px;color:var(--muted);background:var(--surface);border-left:2px solid var(--purple-m);padding:6px 8px;margin-bottom:10px;white-space:pre-wrap}
/* ---- 新手引导：一键示例问题 ---- */
#app{position:relative}
.tb.help{border-color:var(--purple-m);color:var(--purple);background:var(--purple-l);font-size:11px;padding:5px 8px}
#quickAsk{flex:0 0 auto;border-top:1px dashed var(--line);padding:7px 10px 8px;background:var(--surface)}
.qa-label{font-size:11px;color:var(--faint);margin-bottom:6px;line-height:1.4}
.qa-chips{display:flex;flex-wrap:wrap;gap:5px}
.qa-chips button{border:1px solid var(--purple-m);background:#fff;color:var(--purple);border-radius:14px;padding:3px 9px;font-size:11px;white-space:nowrap}
.qa-chips button:hover{background:var(--purple);color:#fff}
#canvasHint a{color:var(--purple);cursor:pointer;text-decoration:underline;pointer-events:auto}
#canvasHint span{font-size:11px;color:#b6b4ac}
/* ---- 新手引导：三步卡片 ---- */
#guide{position:absolute;right:18px;top:58px;width:300px;max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid var(--purple-m);border-radius:12px;box-shadow:0 8px 28px rgba(44,44,42,.16);z-index:40;padding:0 14px 13px}
.g-head{display:flex;align-items:center;justify-content:space-between;padding:11px 0 9px;border-bottom:1px solid var(--line);font-size:13px}
.g-head b{font-weight:500}
.g-head span{cursor:pointer;color:var(--faint);font-size:18px;line-height:1;padding:0 3px}
.g-head span:hover{color:var(--red)}
.g-steps{margin:10px 0 0;padding-left:20px;font-size:12px;line-height:1.85;color:var(--muted)}
.g-steps li{margin-bottom:5px}
.g-steps b{color:var(--text);font-weight:500}
.g-note{font-size:11px;color:var(--faint);line-height:1.6;margin:9px 0 0;border-top:1px dashed var(--line);padding-top:8px}
.g-foot{display:flex;gap:7px;margin-top:12px}
.g-foot button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 6px;font-size:12px}
.g-foot button.go{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:500}
.g-foot button:hover{border-color:var(--purple)}
.g-done{font-size:12px;line-height:1.8;color:var(--muted);margin-top:10px}
.g-done b{color:var(--green);font-weight:500}
@media (max-height:760px){#guide{top:52px;max-height:calc(100vh - 68px)}.g-steps{line-height:1.6}}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand"><span class="brand-dot"></span>节点式分析工具<span class="brand-sub">可复算 spec + 结论</span></div>
    <button id="btnImport" class="tb">导入表格</button>
    <button id="btnSample" class="tb">样例数据</button>
    <button id="btnEngine" class="tb">引擎 v0</button>
    <button id="btnHelp" class="tb help" title="使用说明">? 说明</button>
    <span id="dataState" class="tb-state">暂无数据</span>
    <div class="tb-spacer"></div>
    <input id="search" class="tb-search" placeholder="搜节点" autocomplete="off">
    <button id="btnMemory" class="tb">记忆</button>
    <button id="btnTidy" class="tb">一键整理</button>
    <button id="btnNew" class="tb primary">+ 新建节点</button>
    <button id="btnExport" class="tb">导出</button>
    <button id="btnReset" class="tb danger">重置</button>
  </header>
  <div id="main">
    <aside id="left">
      <section id="chat">
        <div class="pane-head"><span>对话 · 提问</span><span id="chatHint" class="pane-hint">用日常语言描述分析意图</span></div>
        <div id="chatLog"></div>
        <div id="quickAsk">
          <div class="qa-label">不知道问什么？点一句试试（没数据时会自动载入样例）</div>
          <div class="qa-chips">
            <button data-q="各品牌对局人次排名如何？">品牌排名</button>
            <button data-q="渠道转化率对比">渠道对比</button>
            <button data-q="各月对局人次趋势">月度趋势</button>
            <button data-q="各品牌对局人次占比">品牌占比</button>
          </div>
        </div>
        <div id="chatInput">
          <textarea id="q" rows="2" placeholder="例如：各品牌对局人次排名如何？"></textarea>
          <button id="ask" title="发送">➤</button>
        </div>
      </section>
      <section id="detail">
        <div class="pane-head"><span>节点详情</span><span id="detailClose" class="pane-hint">×</span></div>
        <div id="detailBody"><div class="empty">选择一个节点查看字段口径、图表与结论</div></div>
      </section>
    </aside>
    <div id="canvasWrap">
      <div id="canvas">
        <svg id="edges"></svg>
        <div id="groups"></div>
        <div id="nodes"></div>
        <div id="floatAsk" class="hidden"></div>
      </div>
      <div id="canvasHint">第一次用？<a id="hintGuide">点这里看 3 步上手</a><br><span>分支会随着你的提问生长出来</span></div>
      <div id="zoomBar"><button id="zoomOut">−</button><span id="zoomVal">100%</span><button id="zoomIn">+</button><button id="zoomFit">适配</button></div>
      <div id="suggestBar" class="hidden"></div>
    </div>
  </div>
  <div id="guide" class="hidden">
    <div class="g-head"><b>第一次用？跟着点 3 下</b><span id="guideX" title="关闭">×</span></div>
    <div id="guideBody"></div>
    <div id="guideFoot"></div>
  </div>
  <div id="toast"></div>
  <div id="modal" class="hidden"></div>
  <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.json" class="hidden">
</div>
<script>/* ==== 00_util.js ==== */
(function (root) {
  var NB = root.NB = root.NB || {};

  NB.LINK = { w: { fields: 0.35, dataset: 0.25, caliber: 0.20, time: 0.15, lineage: 0.05 }, auto: 0.70, suggest: 0.50 };
  NB.BUDGET = { tokens: 6000, perNode: 400, charsPerToken: 1.6 };
  NB.LAYOUT = { grid: 24, nodeW: 240, nodeH: 176, gapX: 320, gapY: 240, originX: 80, originY: 80, zoomMin: 0.4, zoomMax: 2.0 };
  NB.LIMITS = { storageBytes: 4.5 * 1024 * 1024, undoSteps: 20, saveDebounce: 300 };

  var seq = 0;
  NB.uid = function (p) { seq += 1; return (p || 'n') + '_' + Date.now().toString(36) + '_' + seq.toString(36); };
  NB.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  NB.clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  NB.esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  NB.debounce = function (fn, ms) { var t = null; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; };
  NB.estimateTokens = function (s) { return Math.ceil(Array.from(String(s || '')).length / NB.BUDGET.charsPerToken); };
  NB.fmt = function (n) {
    if (typeof n !== 'number' || !isFinite(n)) return String(n);
    var neg = n < 0, a = Math.abs(n);
    var fixed = (Math.round(a * 100) / 100).toFixed(a % 1 === 0 ? 0 : 2).replace(/\.00$/, '');
    var parts = fixed.split('.'), i = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + i + (parts[1] ? '.' + parts[1] : '');
  };
  NB.pct = function (a, b) { return b ? (Math.round(a / b * 1000) / 10) : 0; };

  function fnv(s, seed) {
    var h = seed >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  NB.hash = function (s) {
    s = String(s || '');
    var a = fnv(s, 2166136261).toString(16);
    var b = fnv(s.split('').reverse().join(''), (2246822519 ^ s.length) >>> 0).toString(16);
    return ('00000000' + a).slice(-8) + ('00000000' + b).slice(-8);
  };

  function isNum(v) { return /^-?\d+(\.\d+)?$/.test(String(v).trim()); }
  function isDate(v) { return /^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(String(v).trim()); }

  NB.parseTable = function (text) {
    text = String(text || '').replace(/^\uFEFF/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var delim = firstLine.split('\t').length >= firstLine.split(',').length ? '\t' : ',';
    var rows = [], row = [], cur = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; } }
        else { cur += c; }
      } else if (c === '"') { inQ = true; }
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') { cur += c; }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
    if (!rows.length) return { columns: [], rows: [], types: {}, numericCols: [], dateCols: [], catCols: [], delim: delim, text: text };
    var columns = rows.shift().map(function (s, k) { return String(s).trim() || ('列' + (k + 1)); });
    rows = rows.map(function (r) {
      var out = [];
      for (var k = 0; k < columns.length; k++) out.push(String(r[k] == null ? '' : r[k]).trim());
      return out;
    });
    var types = {}, numericCols = [], dateCols = [], catCols = [];
    columns.forEach(function (col, k) {
      var vals = rows.map(function (r) { return r[k]; }).filter(function (v) { return v !== ''; });
      var nh = vals.filter(isNum).length, dh = vals.filter(isDate).length;

      if (!hit) { R.toast('没有匹配的节点'); return; }
      var z = G.state.ui.zoom;
      G.setUI({ tx: Math.round(wrap.clientWidth / 2 - (hit.x + 120) * z), ty: Math.round(wrap.clientHeight / 2 - (hit.y + 88) * z) });
      G.setActive(hit.id);
    });

    document.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey) || String(e.key).toLowerCase() !== 'z') return;
      var t = String(e.target.tagName).toUpperCase();
      if (t === 'INPUT' || t === 'TEXTAREA') return;
      e.preventDefault(); G.undo(); R.draw();
    });
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) R.closeModal(); });
  }

  /* ---- 新手引导：让「不会玩」的人点 3 下就能看到完整效果 ---- */
  var GUIDE_KEY = 'nb_guide_seen_v1';
  function guideSeen() {
    try { return localStorage.getItem(GUIDE_KEY) === '1'; } catch (e) { return false; }
  }
  function markGuideSeen() {
    try { localStorage.setItem(GUIDE_KEY, '1'); } catch (e) { }
  }
  function openGuide() {
    renderGuide(0);
    $('guide').classList.remove('hidden');
  }
  function closeGuide() {
    $('guide').classList.add('hidden');
    markGuideSeen();
  }
  function renderGuide(step) {
    var body = $('guideBody'), foot = $('guideFoot');
    $('guide').querySelector('.g-head b').textContent = step === 1 ? '演示完成 · 最后一步' : '第一次用？跟着点 3 下';
    if (step === 1) {
      body.innerHTML = '<div class="g-done"><b>演示已跑完。</b>画布上现在是「数据入口 → 两个分支节点」，' +
        '左下图里有条形图、数据表和结论，还能看到这次用了哪些字段、什么口径。<br><br>' +
        '最后一步留给你：在紫色框里打一句（比如「趋势变化是否与渠道结构有关？」），点 <b>交叉分析</b>，' +
        '就会长出一个同时连着两个父节点的汇聚节点。<br><br>' +
        '以后想再看这份说明，点顶部「? 说明」；点错了按 Ctrl+Z 撤销。</div>';
      foot.innerHTML = '<div class="g-foot"><button data-g="done" class="go">知道了，开始玩</button></div>';
      return;
    }
    body.innerHTML = '<ol class="g-steps">' +
      '<li><b>① 载入数据</b>：点顶部「样例数据」→ 79 行 × 23 列示例表格。</li>' +
      '<li><b>② 问一句</b>：左下输入框打「各品牌对局人次排名如何？」回车，或直接点「品牌排名」这类示例。</li>' +
      '<li><b>③ 看结果</b>：画布长出节点，左下出图表 + 表格 + 结论，并列出字段口径与数据版本。</li>' +
      '<li><b>④ 做汇总</b>：勾两个节点右上角的 □，紫框里点「交叉分析」→ 出现分叉汇聚的推理链。</li>' +
      '</ol>' +
      '<div class="g-note">不想一步步点？「一键跑一遍演示」会自动做完 ①②③ 并把 ④ 的紫框摆好，最后一步留给你亲手点。' +
      '演示不会覆盖已有节点；任何操作都能 Ctrl+Z 撤销。</div>';
    foot.innerHTML = '<div class="g-foot"><button data-g="demo" class="go">▶ 一键跑一遍演示</button><button data-g="close">我自己来</button></div>';
  }
  function quickAsk(q) {
    if (!G.table) loadSample();
    $('q').value = q;
    submit(q);
  }
  function runDemo() {
    if (G.state.nodes.length) {
      R.toast('当前已有节点，演示不会覆盖它们；直接点左下的示例问题继续');
      closeGuide();
      return;
    }
    loadSample();
    submit('各品牌对局人次排名如何？');
    submit('渠道转化率对比');
    var qs = G.state.nodes.filter(function (n) { return n.type === 'question'; });
    if (qs.length >= 2) {
      G.clearSelection();
      G.toggleSelect(qs[0].id);
      G.toggleSelect(qs[1].id);
    }
    renderGuide(1);
    R.toast('演示已跑完：2 个分支节点已生成，最后一步留给你');
  }

  function copyNode(id) {
    var n = G.findNode(id); if (!n) return;
    var c = NB.clone(n);
    c.id = NB.uid('n'); c.title = n.title + '（副本）'; c.x = n.x + 40; c.y = n.y + 40;
    c.createdAt = Date.now(); c.parentIds = []; c.version = 1;
    G.commit(function () { G.state.nodes.push(c); G.state.active = c.id; });
    R.toast('已复制节点（spec 与结论快照一并保留）');
  }

  function loadSample() {
    var t = NB.parseTable(NB.SAMPLE_CSV);
    var h = NB.tableHash(t);
    if (G.state.dataset && G.state.dataset.hash === h && G.table) { R.toast('样例数据已是当前版本'); return; }
    G.setDataset(t, '示例表格_脱敏版.csv', NB.SAMPLE_CSV);
    R.addMsg('ai', '已载入 79 行 × 23 列样例数据。试试问「各品牌对局人次排名如何？」或「渠道转化率对比」。');
  }

  var pendingParent = null;
  function ensureVisible(id) {
    var n = G.findNode(id); if (!n) return;
    var wrap = $('canvasWrap'), ui = G.state.ui, pad = 28;
    var vx = -ui.tx / ui.zoom, vy = -ui.ty / ui.zoom;
    var vw = wrap.clientWidth / ui.zoom, vh = wrap.clientHeight / ui.zoom;
    var l = n.x - pad, r = n.x + NB.LAYOUT.nodeW + pad, t = n.y - pad, b = n.y + NB.LAYOUT.nodeH + pad;
    var dx = 0, dy = 0;
    if (r > vx + vw) dx = (vx + vw) - r;
    if (l + dx < vx) dx = vx - l;
    if (b > vy + vh) dy = (vy + vh) - b;
    if (t + dy < vy) dy = vy - t;
    if (dx || dy) G.setUI({ tx: ui.tx + dx * ui.zoom, ty: ui.ty + dy * ui.zoom });
  }

  function submit(q, parentId) {
    q = String(q || '').trim(); if (!q) return;
    var pid = parentId || pendingParent; pendingParent = null;
    var res = G.ask(q, pid ? { parentId: pid } : undefined);
    if (!res.ok) { R.toast(res.msg); return; }
    R.addMsg('user', q);
    if (res.cross) {
      R.addMsg('ai', res.node.result.conclusion + '\n\n[已合并 ' + res.ctx.included.length + ' 个节点上下文 · ' + res.ctx.tokens + ' token' +
        (res.ctx.omitted.length ? ' · 省略 ' + res.ctx.omitted.length + ' 个' : '') + ']', { drag: true });
    } else {
      R.addMsg('ai', res.node.result.conclusion + '\n\n[自动连线 ' + res.autoEdges + ' 条 · 建议 ' + res.suggest + ' 条]', { drag: true });
    }
    $('q').value = '';
    ensureVisible(res.node.id);
  }

  function init() {
    G.init(); R.init(); R.draw(); bind();
    if (!G.state.nodes.length && !guideSeen()) openGuide();
    if (!G.state.nodes.length) {
      R.addMsg('ai', '欢迎。先点「样例数据」载入 79 行 × 23 列示例表格，再用日常语言提问。\n\n每个节点同时保存 spec（可复算口径）、result（图表与结论快照）、rawAnswer（原始上下文）——这是它和「只存结论的思维导图」的区别。');
    } else {
      R.addMsg('ai', '已恢复上次的分析现场：' + G.state.nodes.length + ' 个节点 / ' + G.state.edges.length + ' 条连线。');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
